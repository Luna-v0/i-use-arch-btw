# Extra autostart processes
# exec-once = uwsm-app -- my-service

# Start tmux session to load config and plugins (only if no session exists)
exec-once = tmux has-session 2>/dev/null || tmux new-session -d -s _init
exec-once = uwsm-app -- bitwarden-desktop
# Chromium web-apps all share ONE profile. Launching several --app windows in the
# same instant makes them race for the profile's SingletonLock; the losers throw
# Chromium's native "Profile error occurred / profile could not be opened" dialog.
# Fix: launch the first app, then wait until its Chromium owns the profile
# (SingletonSocket exists). Once one instance owns the profile, later launches
# hand off to it as windows and can never race — no fixed sleeps needed.
exec-once = omarchy-launch-webapp "https://music.youtube.com/"
exec-once = bash -c 'until [ -e ~/.config/chromium/SingletonSocket ]; do sleep 0.3; done; omarchy-launch-webapp "https://web.whatsapp.com/"'
exec-once = bash -c 'until [ -e ~/.config/chromium/SingletonSocket ]; do sleep 0.3; done; omarchy-launch-or-focus-webapp discord "https://discord.com/channels/@me"'
exec-once = uwsm-app -- slack
exec-once = rclone mount gdrive: ~/GDrive/ --vfs-cache-mode writes &
exec-once = hyprshell run

windowrule = match:class Bitwarden, workspace 9
windowrule = match:class .*iscord.*, workspace 13
windowrule = match:class [Ss]lack, workspace 19
windowrule = match:class .*hatsapp.*, workspace 14
windowrule = match:class .*usic\.youtube.*, workspace 15