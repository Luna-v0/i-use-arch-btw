# prefix
set -g prefix C-a
unbind C-b
bind   C-a send-prefix

# keybindings
# prefix+w: fuzzy session/window switcher in a popup. tmux's native choose-tree
# renders blank when opened over a fullscreen alt-screen app (e.g. Claude Code),
# so use a popup surface (always paints) + fzf (better for many sessions).
bind w display-popup -E -w 70% -h 70% "tmux list-windows -a -F '#{session_name}:#{window_index}  #{window_name}' | fzf --reverse --header='switch window' | cut -d' ' -f1 | xargs -r tmux switch-client -t"

# shell: run xonsh in every pane WITHOUT making it the login/POSIX shell.
# default-command (not default-shell) keeps $SHELL=bash so POSIX scripts/tools
# still work. $HOME is expanded by tmux's `sh -c` at pane-launch time.
set -g default-command "$HOME/.local/xonsh-env/bin/xonsh"

# usability
set -g mouse on
set -g history-limit 2000
set -as -g terminal-overrides ',xterm-256color:Tc'

# status line (Catppuccin-ish to match Kitty)
set -g status-position top
set -g status-style "bg=#0a2410 fg=#33ff88"
set -g status-left  " #[bold]#S "
# Anti-burn: drop the static clock/date and window-index numbers (names only).
set -g status-right ""
set -g window-status-format         " #W "
set -g window-status-current-format " #[bold]#W "

# Palette-driven colors (generated by `tmux-palette` from the active theme).
# Overrides the static status-style above so tmux follows the dynamic theme.
source-file -q ~/.config/tmux/theme.conf

# plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'      # sane defaults :contentReference[oaicite:0]{index=0}
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'tmux-plugins/tmux-yank'

set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'off'

run '~/.config/tmux/plugins/tpm/tpm'

# Enable OSC 52 clipboard forwarding for remote Neovim yanks.
set -as terminal-features ",*:clipboard"
# Under the default `set-clipboard external`, tmux only FORWARDS an app's own OSC
# 52 (so nvim yanks reach the local clipboard over SSH) but does NOT emit OSC 52
# when *you* copy — so mouse-selection / copy-mode over SSH never reach the local
# clipboard. `on` makes tmux send OSC 52 on every copy, so copying over SSH lands
# in your LOCAL terminal's clipboard (needs an OSC52-capable local terminal —
# kitty/ghostty/wezterm/alacritty all qualify).
set -g set-clipboard on
