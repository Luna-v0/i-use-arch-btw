# Run Whisper inference on the integrated AMD GPU instead of the RTX 4060 Ti.
#
# Restricting VK_DRIVER_FILES to the radeon ICD is deliberate: voxtype's
# --gpu-device takes a numeric index, and the enumeration order is not
# guaranteed (voxtype setup gpu --status lists NVIDIA first). Showing it only
# the AMD driver removes the ambiguity entirely.
#
# Trade-off: transcription runs on 2 RDNA2 CUs rather than the 4060 Ti. The
# tiny.en model is small enough that this is usually fine; if dictation feels
# slow, delete this file and `systemctl --user daemon-reload`.
[Service]
Environment=VK_DRIVER_FILES=/usr/share/vulkan/icd.d/radeon_icd.json
Environment=VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/radeon_icd.json
